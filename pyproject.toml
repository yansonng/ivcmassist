[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-tiling"
version = "1.0.0"
description = "Tiled ResUNet inference for corneal nerve and dendritic cell segmentation in IVCM mosaics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alisa Lincke" },
    { name = "Meichen Ji" },
    { name = "Yan Song" },
]
dependencies = [
    "keras>=3.8.0",
    "torch>=2.5.1",
    "numpy>=2.0",
    "opencv-python>=4.11",
    "tifffile>=2024.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
